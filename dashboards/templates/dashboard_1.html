<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi-Fi Audio Dashboard</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07070a;
            --accent: #9d4edd;
            --accent-glow: rgba(157, 78, 221, 0.4);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #e0e0f0;
            --text-dim: #8a8a9a;
            --success: #00f5d4;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(157, 78, 221, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(61, 44, 141, 0.05) 0%, transparent 50%);
        }

        /* Now Playing Section - COMPACT */
        .now-playing {
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            padding: 0.5rem; /* Tiny padding */
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .track-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem; /* Smaller font */
            font-weight: 600;
            margin: 0;
            background: linear-gradient(90deg, #fff, #b39ddb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .track-artist {
            color: var(--text-dim);
            font-size: 0.8rem;
            margin: 0 0 0.5rem 10px;
            display: inline-block;
        }

        /* Controls - SMALLER */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 0.5rem; /* Tiny margin */
        }

        .btn-circle {
            width: 40px; /* Shrunk from 60px */
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1rem;
            touch-action: manipulation;
        }

        .btn-circle:hover {
            background: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            border-color: transparent;
        }

        .btn-circle:active {
            transform: scale(0.9);
        }

        /* Volume Slider Styling */
        .volume-control {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 0.5rem;
            padding: 0 1rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .vol-slider-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
        }

        #volume-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: transform 0.1s;
        }

        #volume-slider:active::-webkit-slider-thumb {
            transform: scale(1.3);
        }

        .vol-icon {
            color: var(--text-dim);
            font-size: 1.1rem;
            min-width: 24px;
        }

        .vol-value {
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            color: var(--text-main);
            min-width: 45px;
            text-align: right;
            font-weight: 600;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            padding: 6px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
        }

        /* Seek Bar */
        .seek-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 0.2rem;
            padding: 0 1rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        #seek-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            height: 4px;
            background: var(--glass-border);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        #seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
            transition: transform 0.1s;
        }

        #seek-slider:active::-webkit-slider-thumb {
            transform: scale(1.3);
        }

        .seek-time {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            color: var(--text-dim);
            white-space: nowrap;
            min-width: 38px;
        }

        /* Track List */
        .track-list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem 1rem 1rem 4rem;
        }

        .track-list {
            max-width: 800px;
            margin: 0 auto;
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            margin-bottom: 8px;
            background: var(--glass);
            border: 1px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--glass-border);
        }

        .track-info {
            flex-grow: 1;
        }

        .track-item-title {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .track-item-sub {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .format-tag {
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: bold;
            margin-right: 8px;
        }

        /* Media Tabs */
        .media-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 1rem 0;
        }
        
        .tab-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            transition: all 0.2s;
            touch-action: manipulation; /* prevent 300ms ghost-click delay */
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        
        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Hamburger Menu Icon */
        .hamburger-btn {
            display: none;
            padding: 10px;
            cursor: pointer;
            color: var(--text-dim);
            transition: color 0.2s;
        }
        .hamburger-btn:hover { color: var(--accent); }
        .edit-mode .hamburger-btn { display: block; }
        .edit-mode .track-item { cursor: default; }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 10px;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            padding: 6px 16px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: #2c2c34;
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #15151a;
            border: 1px solid var(--glass-border);
            padding: 1rem; /* Reduced from 2rem */
            border-radius: 15px;
            width: 90%;
            max-width: 320px; /* Reduced from 400px */
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .modal-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem; /* Reduced from 1.4rem */
            margin-bottom: 1rem;
            color: var(--text-main);
            text-align: center;
        }
        .form-group {
            margin-bottom: 0.8rem; /* Reduced from 1rem */
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        .form-input {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            background: rgba(255,255,255,0.08);
        }
        select.form-input option {
            background-color: #15151a;
            color: white;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 1.5rem;
        }
        .btn-primary {
            flex: 1;
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px; /* Reduced from 12px */
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            touch-action: manipulation;
        }
        .btn-secondary {
            flex: 1;
            background: var(--glass);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 8px; /* Reduced from 12px */
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-danger {
            flex: 1;
            background: rgba(255, 69, 58, 0.1);
            color: #ff453a;
            border: 1px solid #ff453a;
            padding: 8px; /* Reduced from 12px */
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-danger:hover {
            background: rgba(255, 69, 58, 0.2);
        }

        /* Star Rating */
        .star-rating {
            display: flex;
            gap: 5px;
            font-size: 1.5rem;
            color: #4a4a4a;
            cursor: pointer;
        }
        .star-rating .star.active {
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }
        .track-item-stars {
            font-size: 0.8rem;
            color: #ffcc00;
            margin-top: 2px;
        }

        @media (max-width: 600px) {
            .track-title { font-size: 1.4rem; }
            .btn-circle { width: 50px; height: 50px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <section class="now-playing">
        <h1 id="playing-title" class="track-title">Select a Track</h1>
        <div id="playing-artist" class="track-artist">Ready to Play</div>
        
        <div id="playing-badges" class="metadata-badges">
            <!-- Badges like FLAC, 192kHz injected here -->
        </div>

        <div class="controls">
            <div class="controls-group">
                <button type="button" class="btn-circle" style="background: var(--success); color: black;" onclick="resumeMusic()" title="Resume">▶</button>
                <button type="button" class="btn-circle" onclick="pauseMusic()" title="Pause">⏸</button>
                <button type="button" class="btn-circle" onclick="stopMusic()" title="Stop">⏹</button>
            </div>
            
            <button type="button" id="btn-video" class="btn-circle" style="background: var(--accent)" onclick="toggleVideo()" title="Toggle Video (ON/OFF)">📺</button>
        </div>

        <div class="volume-control">
            <div class="vol-slider-wrapper">
                <span class="vol-icon">🔊</span>
                <input type="range" id="volume-slider" min="0" max="100" value="50"
                       oninput="updateVolume(this.value)">
                <span id="volume-value" class="vol-value">50%</span>
            </div>
        </div>

        <!-- Seek Bar -->
        <div class="seek-container">
            <span class="seek-time" id="seek-current">0:00</span>
            <input type="range" id="seek-slider" min="0" max="100" value="0"
                   onmousedown="window.seekDragging=true"
                   ontouchstart="window.seekDragging=true"
                   onmouseup="onSeekRelease()"
                   ontouchend="onSeekRelease()"
                   oninput="updateSeekDisplay(this.value)">
            <span class="seek-time" id="seek-total">0:00</span>
        </div>
    </section>

    <div class="track-list-container">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 15px;">
            <h2 style="font-family: 'Outfit', sans-serif; margin: 0;">My Collection</h2>
            <div class="filter-group" style="display: flex; gap: 5px;">
                <button type="button" class="filter-btn" onclick="filterByStars(3)" title="3 Stars">★★★</button>
                <button type="button" class="filter-btn" onclick="filterByStars(2)" title="2 Stars">★★</button>
                <button type="button" class="filter-btn" onclick="filterByStars(1)" title="1 Star">★</button>
                <button type="button" class="filter-btn" onclick="filterByStars(-1)" title="Unrated">No Star</button>
                <button type="button" class="filter-btn active" id="star-all-btn" onclick="filterByStars(0)">All</button>
            </div>
            <button type="button" id="toggle-edit-btn" class="tab-btn" onclick="toggleEditMode()" style="padding: 6px 15px; font-size: 0.8rem;">Edit Off</button>
        </div>
        <div class="media-tabs">
            <button type="button" class="tab-btn" id="tab-music-btn" onclick="switchTab('music')">Music</button>
            <button type="button" class="tab-btn active" id="tab-video-btn" onclick="switchTab('video')">Video</button>
        </div>
        
        <!-- Removed the old star-filter-bar div as it's now next to the title -->
        
        <div class="filter-bar" id="category-filter-bar">
            <button class="filter-btn active" onclick="filterByCategory('All')">All Categories</button>
            <button class="filter-btn" onclick="filterByCategory('Pop')">Pop</button>
            <button class="filter-btn" onclick="filterByCategory('Rock')">Rock</button>
            <button class="filter-btn" onclick="filterByCategory('Classical')">Classical</button>
            <button class="filter-btn" onclick="filterByCategory('Spanish')">Spanish</button>
            <button class="filter-btn" onclick="filterByCategory('Chinese')">Chinese</button>
        </div>

        <div class="filter-bar" id="artist-filter-bar" style="border-top: 1px solid var(--glass-border); padding-top: 10px; margin-top: 5px;">
            <!-- Artist filters injected here -->
        </div>

        <div id="track-list" class="track-list">
            <div style="text-align:center; padding: 2rem; color: var(--text-dim)">Loading Media Library...</div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">Edit Song Details</h3>
            <div class="form-group" style="display: none;">
                <label class="form-label">Physical Filename (on Disk)</label>
                <input type="text" id="edit-filename" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Song Title</label>
                <input type="text" id="edit-title" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Artist Name</label>
                <input type="text" id="edit-artist" class="form-input">
            </div>
            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label class="form-label">Year</label>
                    <input type="text" id="edit-year" class="form-input">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label class="form-label">Category</label>
                    <select id="edit-category" class="form-input">
                        <option value="All">All / None</option>
                        <option value="Pop">Pop</option>
                        <option value="Rock">Rock</option>
                        <option value="Classical">Classical</option>
                        <option value="Spanish">Spanish</option>
                        <option value="Chinese">Chinese</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Rating (3-Star System)</label>
                <div id="edit-stars" class="star-rating" style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; justify-content: center;">
                    <span class="star" data-value="1" onclick="setEditRating(1)" style="font-size: 2rem; padding: 0 10px;">★</span>
                    <span class="star" data-value="2" onclick="setEditRating(2)" style="font-size: 2rem; padding: 0 10px;">★</span>
                    <span class="star" data-value="3" onclick="setEditRating(3)" style="font-size: 2rem; padding: 0 10px;">★</span>
                </div>
                <small style="color: var(--text-dim); font-size: 0.7rem; display: block; text-align: center; margin-top: 5px;">Tap stars to rate 1-3. Tap again to reset to No Star.</small>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeModal(event)">Cancel</button>
                <button type="button" class="btn-primary" onclick="saveSongDetails(event)">Save</button>
                <button type="button" class="btn-danger" onclick="deleteSong()">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // --- CORE STATE ---
        let isEditMode = false; // Force OFF on startup to avoid click blocking
        let currentMediaType = 'video';
        let currentCategory = 'All';
        let currentArtist = 'All';
        let currentStars = 0; // 0=All, -1=Unrated, 1-5=Stars
        let allSongs = [];
        let editingPath = null;
        let originalFilename = null;
        let currentEditRating = 0;
        let currentDuration = 0;
        window.seekDragging = false;
        let lastPlayedPath = null;

        // --- UI SYNC ---
        function syncUI() {
            const btn = document.getElementById('toggle-edit-btn');
            const container = document.getElementById('track-list');
            if (btn) {
                btn.innerText = isEditMode ? 'Edit On' : 'Edit Off';
                btn.classList.toggle('active', isEditMode);
            }
            if (container) {
                container.classList.toggle('edit-mode', isEditMode);
            }
        }

        // --- TOGGLE ---
        function toggleEditMode() {
            isEditMode = !isEditMode;
            localStorage.setItem('editMode', isEditMode);
            console.log("Edit Mode Toggled to:", isEditMode);
            syncUI();
            renderTracks(allSongs);
        }

        // --- TABS ---
        function switchTab(type) {
            currentMediaType = type;
            document.getElementById('tab-music-btn').classList.toggle('active', type === 'music');
            document.getElementById('tab-video-btn').classList.toggle('active', type === 'video');
            refreshList();
        }

        // --- FETCHING ---
        async function fetchSongs() {
            try {
                fetchVolume();
                const response = await fetch(`/api/songs?type=${currentMediaType}`);
                const songs = await response.json();
                allSongs = songs;
                renderArtistFilters(songs);
                renderTracks(songs);
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        function refreshList() {
            syncUI();
            document.getElementById('track-list').innerHTML = '<div style="text-align:center; padding: 2rem;">Refreshing...</div>';
            fetchSongs();
        }

        // --- FILTERS ---
        function filterByCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('#category-filter-bar .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === (cat === 'All' ? 'All Categories' : cat));
            });
            // Reset artist filter when category changes to avoid empty results
            currentArtist = 'All';
            renderArtistFilters(allSongs);
            renderTracks(allSongs);
        }

        function filterByArtist(artist) {
            currentArtist = artist;
            renderArtistFilters(allSongs); // Refresh filter bar UI
            renderTracks(allSongs);
        }

        function filterByStars(stars) {
            currentStars = stars;
            // Update active state for all star buttons (both in the header and anywhere else)
            document.querySelectorAll('.filter-group .filter-btn').forEach((btn, idx) => {
                const vals = [3, 2, 1, -1, 0]; // Order in HTML: 3, 2, 1, Unrated, All
                btn.classList.toggle('active', vals[idx] === stars);
            });
            renderTracks(allSongs);
        }

        function setEditRating(val) {
            // Toggle logic: if clicking the same rating, reset to 0
            currentEditRating = (currentEditRating === val) ? 0 : val;
            updateModalStars(currentEditRating);
        }

        function updateModalStars(val) {
            document.querySelectorAll('#edit-stars .star').forEach(s => {
                s.classList.toggle('active', parseInt(s.getAttribute('data-value')) <= val);
            });
        }

        function renderArtistFilters(songs) {
            const container = document.getElementById('artist-filter-bar');
            
            // Filter the song list by category BEFORE building the artist list
            let filteredForArtists = songs;
            if (currentCategory !== 'All') {
                filteredForArtists = songs.filter(s => s.category === currentCategory);
            }

            const artistSet = new Set(filteredForArtists.map(s => (s.artist && s.artist !== 'Unknown Artist') ? s.artist : 'Others'));
            const artists = ['All', ...Array.from(artistSet).sort()];
            
            container.innerHTML = '';
            artists.forEach(artist => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn' + (currentArtist === artist ? ' active' : '');
                btn.innerText = artist === 'All' ? 'All Artists' : artist;
                btn.onclick = () => filterByArtist(artist);
                container.appendChild(btn);
            });
        }

        // --- RENDERING ---
        function renderTracks(songs) {
            const container = document.getElementById('track-list');
            syncUI();

            let filtered = songs;
            
            // 1. Filter by Stars (Priority 1)
            if (currentStars !== 0) {
                if (currentStars === -1) {
                    filtered = filtered.filter(s => !s.rating || s.rating === 0);
                } else {
                    filtered = filtered.filter(s => s.rating === currentStars);
                }
            }

            // 2. Filter by Category (Priority 2)
            if (currentCategory !== 'All') {
                filtered = filtered.filter(s => s.category === currentCategory);
            }

            // 3. Filter by Artist (Priority 3)
            if (currentArtist !== 'All') {
                filtered = filtered.filter(s => {
                    const a = (s.artist && s.artist !== 'Unknown Artist') ? s.artist : 'Others';
                    return a === currentArtist;
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 2rem;">No matching media found</div>';
                return;
            }

            container.innerHTML = filtered.map(song => {
                const artist = (song.artist && song.artist !== 'Unknown Artist') ? song.artist : 'Others';
                const title = song.title || song.filename || "Unknown Title";
                const catBadge = (song.category && song.category !== 'All') ? `<span style="background:var(--accent); color:white; padding:2px 8px; border-radius:10px; font-size:0.6rem; margin-left:8px;">${song.category}</span>` : '';
                const artBadge = isEditMode ? `<span style="background:#4a4a4a; color:white; padding:2px 8px; border-radius:10px; font-size:0.6rem; margin-left:8px;">👤 ${artist}</span>` : '';
                
                const starsHtml = song.rating > 0 ? `<div class="track-item-stars">${'★'.repeat(song.rating)}</div>` : '';

                const safePath = song.path.replace(/'/g, "\\'");
                const safeTitle = title.replace(/'/g, "\\'");
                const safeArtist = artist.replace(/'/g, "\\'");

                // Build technical info string
                let techInfo = (song.tech.format || 'UNK').toUpperCase();
                if (song.tech.sample_rate) techInfo += ` • ${(song.tech.sample_rate / 1000).toFixed(1)}kHz`;
                if (song.tech.bit_rate) techInfo += ` • ${Math.round(song.tech.bit_rate / 1000)}kbps`;

                return `
                <div class="track-item" onclick="onTrackClick(event, this)" data-path="${safePath}" data-type="${song.type}">
                    <div class="track-info">
                        <span class="track-item-title">${title}${catBadge}${artBadge}</span>
                        <span class="track-item-sub">${artist} • ${techInfo}</span>
                        ${starsHtml}
                    </div>
                    <div class="hamburger-btn" onclick="prepareEdit(event, this, '${safeTitle}', '${safeArtist}', '${song.category}', '${song.year || ''}', '${song.filename}', ${song.rating || 0})">☰</div>
                </div>`;
            }).join('');
        }

        // --- ACTIONS ---
        function onTrackClick(e, el) {
            console.log("Track clicked. EditMode is:", isEditMode);
            if (isEditMode) {
                console.log("Click ignored because Edit Mode is ON.");
                return;
            }
            const path = el.getAttribute('data-path');
            const type = el.getAttribute('data-type');
            console.log("Calling playTrack with:", path, type);
            playTrack(path, type);
        }

        function prepareEdit(e, el, title, artist, cat, year, filename, rating) {
            if (e) e.stopPropagation();
            editingPath = el.closest('.track-item').getAttribute('data-path');
            originalFilename = filename;
            currentEditRating = rating || 0;
            updateModalStars(currentEditRating);
            
            document.getElementById('edit-filename').value = filename;
            document.getElementById('edit-title').value = title;
            document.getElementById('edit-artist').value = (artist === 'Others') ? '' : artist;
            document.getElementById('edit-category').value = cat || 'All';
            document.getElementById('edit-year').value = year || '';
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal(e) {
            if (e) e.preventDefault();
            document.getElementById('edit-modal').style.display = 'none';
        }

        async function saveSongDetails(e) {
            if (e) e.preventDefault();
            const payload = {
                path: editingPath,
                title: document.getElementById('edit-title').value,
                artist: document.getElementById('edit-artist').value || 'Unknown Artist',
                category: document.getElementById('edit-category').value,
                year: document.getElementById('edit-year').value,
                rating: currentEditRating
            };

            const newFile = document.getElementById('edit-filename').value;
            if (newFile !== originalFilename && newFile.trim() !== "") {
                if (!confirm("Rename file? This resets metadata.")) return;
                const res = await fetch('/api/songs/rename', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path: editingPath, new_filename: newFile, type: currentMediaType})
                });
                if ((await res.json()).status === 'success') { closeModal(); refreshList(); return; }
            }

            const res = await fetch('/api/songs/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if ((await res.json()).status === 'success') { closeModal(); refreshList(); }
        }

        async function deleteSong() {
            if (!confirm("Delete permanently?")) return;
            const res = await fetch('/api/songs/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({path: editingPath, type: currentMediaType})
            });
            if ((await res.json()).status === 'success') { closeModal(); refreshList(); }
        }

        async function playTrack(path, type) {
            console.log("Playing:", path); 
            try {
                const res = await fetch('/api/play', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path, type})
                });
                const data = await res.json();
                if (data.status === 'success') {
                    // Update Now Playing area immediately
                    updateNowPlaying(data.track);
                    // Match music_player.py: Video Toggle defaults to ON when new track starts
                    videoEnabled = true;
                    updateVideoButton();
                }
            } catch (err) {
                console.error("Play error:", err);
            }
        }

        async function toggleVideo() {
            videoEnabled = !videoEnabled;
            try {
                await fetch('/api/video/toggle', { method: 'POST' });
                updateVideoButton();
            } catch (err) {
                console.error("Video toggle error:", err);
            }
        }

        function updateVideoButton() {
            const btn = document.getElementById('btn-video');
            if (!btn) return;
            if (videoEnabled) {
                btn.style.background = 'var(--accent)';
                btn.style.opacity = '1';
            } else {
                btn.style.background = 'transparent';
                btn.style.opacity = '0.5';
            }
        }

        async function stopMusic() { await fetch('/api/stop', {method: 'POST'}); refreshList(); }
        async function pauseMusic() { await fetch('/api/pause', {method: 'POST'}); }
        async function resumeMusic() { await fetch('/api/resume', {method: 'POST'}); }

        async function fetchVolume() {
            const res = await fetch('/api/volume');
            const data = await res.json();
            document.getElementById('volume-slider').value = data.volume;
            document.getElementById('volume-value').innerText = Math.round(data.volume) + '%';
        }

        async function updateVolume(val) {
            document.getElementById('volume-value').innerText = val + '%';
            await fetch('/api/volume', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({volume: val})});
        }

        function formatTime(s) {
            if (!s || isNaN(s)) return '0:00';
            let m = Math.floor(s/60);
            let sec = Math.floor(s%60).toString().padStart(2,'0');
            return m+':'+sec;
        }

        function updateNowPlaying(track) {
            if (!track) return;
            document.getElementById('playing-title').innerText = track.title || "Unknown";
            document.getElementById('playing-artist').innerText = track.artist || "";
            
            const badges = document.getElementById('playing-badges');
            if (badges && track.tech) {
                // Perfect metadata display from music_player.py
                let html = `<span style="color:var(--accent)">▶ PLAYING</span> • `;
                html += (track.tech.format || 'UNK').toUpperCase();
                if (track.tech.sample_rate) html += ` • ${(track.tech.sample_rate / 1000).toFixed(1)}kHz`;
                if (track.tech.bit_rate) html += ` • ${Math.round(track.tech.bit_rate / 1000)}kbps`;
                badges.innerHTML = html;
            }
        }

        async function pollStatus() {
            try {
                const res = await fetch('/api/status');
                const d = await res.json();
                
                if (d.status !== 'error') {
                    // Update metadata if title changed
                    if (d.title !== document.getElementById('playing-title').innerText) {
                        updateNowPlaying(d);
                    }

                    // Update video button state from poll
                    if (d.video_enabled !== undefined) {
                        updateVideoButton(d.video_enabled);
                    }

                    // Update Seek Bar
                    currentDuration = d.duration || 0;
                    if (!window.seekDragging && currentDuration > 0) {
                        document.getElementById('seek-total').innerText = formatTime(currentDuration);
                        document.getElementById('seek-current').innerText = formatTime(d.position);
                        document.getElementById('seek-slider').value = (d.position / currentDuration) * 100;
                    }
                }
            } catch (e) {}
            setTimeout(pollStatus, 1500);
        }

        window.onload = () => { 
            localStorage.setItem('editMode', 'false'); // Force reset on refresh
            syncUI(); 
            fetchSongs(); 
            pollStatus();
        };

        async function onSeekRelease() {
            window.seekDragging = false;
            const slider = document.getElementById('seek-slider');
            const pos = (slider.value / 100) * currentDuration;
            await fetch('/api/seek', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({position: pos})
            });
        }

        function updateSeekDisplay(val) {
            if (currentDuration > 0) {
                const pos = (val / 100) * currentDuration;
                document.getElementById('seek-current').innerText = formatTime(pos);
            }
        }
    </script>
</body>
</html>
